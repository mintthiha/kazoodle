version: v2
clean: true
inputs:
  - directory: proto/core
plugins:
  # Go types -> server/internal/protocol/protocol.pb.go
  - local: protoc-gen-go
    out: ../server/internal/protocol
    opt: paths=source_relative

  # TypeScript types -> web/src/net/gen/protocol_pb.ts
  - local: protoc-gen-es
    out: ../web/src/net/gen
    opt:
      - target=ts
      - import_extension=none
