version: v2
# A workspace with one module per protocol surface: the core session protocol,
# and one per game. They do not import each other.
modules:
  - path: proto/core
  - path: proto/games/imposter
lint:
  use:
    - STANDARD
  except:
    # Each module is a single flat file with a versioned package name
    # (partygames.v1, imposter.v1), so the file path deliberately does not
    # mirror the package.
    - PACKAGE_DIRECTORY_MATCH
breaking:
  use:
    - FILE
