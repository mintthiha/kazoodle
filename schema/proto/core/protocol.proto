syntax = "proto3";

package partygames.v1;

option go_package = "github.com/mintthiha/party-games/server/internal/protocol;protocol";

// The core session wire protocol: rooms, presence, and a generic envelope for
// running games. It stays game-agnostic — a game's own messages are defined in
// its own .proto (e.g. games/imposter.proto) and carried inside GameEvent /
// GameAction as JSON.
//
// Messages travel over the WebSocket as proto3 canonical JSON.

// ── Shared ────────────────────────────────────────────────────────────────

// A player in a room. `id` is assigned by the server and is unique within a
// room. It belongs to the seat rather than the socket: a phone that reconnects
// with ResumeRoom keeps its id, its score and its place in a running game. A
// player's locale is not exposed to other clients; only the server uses it.
message Player {
  string id = 1;
  string display_name = 2;

  // True for a main screen: a shared display (a TV, a laptop on a projector)
  // that sits in the room to show the game to everyone. It is on the roster so
  // it gets every public broadcast and can be the host, but it is never dealt
  // into a game as a player and does not count towards a game's minimum.
  bool screen = 3;
}

// ── Client → Server ───────────────────────────────────────────────────────

// Every message a client sends is a ClientMessage with exactly one payload set.
message ClientMessage {
  oneof payload {
    CreateRoom create_room = 1;
    JoinRoom join_room = 2;
    LeaveRoom leave_room = 3;
    Echo echo = 4;
    StartGame start_game = 5;
    GameAction game_action = 6;
    SetGameOptions set_game_options = 7;
    ResumeRoom resume_room = 8;
    KickPlayer kick_player = 9;
  }
}

// Ask the server to mint a new room. The server picks the room code and
// replies with RoomJoined. The creator becomes the room's host.
message CreateRoom {
  string display_name = 1;
  // BCP-47-ish tag, e.g. "en" or "fr". Used to localize server-produced,
  // player-facing strings (a game's secret word, for one). Defaults to "en".
  string locale = 2;
  // Join as a main screen rather than a player. See Player.screen.
  bool screen = 3;
}

// Join an existing room by code. Replies with RoomJoined, or ErrorInfo if the
// room does not exist.
message JoinRoom {
  string room_code = 1;
  string display_name = 2;
  string locale = 3;
  // Join as a main screen rather than a player. See Player.screen.
  bool screen = 4;
}

// Host-only: remove someone from the room — a phone left behind, or a guest
// spoiling the game. They are sent ErrorInfo "kicked" and then dropped exactly
// as if they had left, so a running game hears about it as a departure.
message KickPlayer {
  string player_id = 1;
}

// Leave the current room. The connection stays open; the client may create or
// join another room afterwards.
message LeaveRoom {}

// Reclaim a seat after the connection dropped. `session_token` is the secret
// from RoomJoined. Replies with RoomJoined (resumed = true), or ErrorInfo
// "session_expired" if the seat was given up (the client should then join again
// as a new player) or "room_not_found" if the room has gone.
message ResumeRoom {
  string room_code = 1;
  string session_token = 2;
}

// Round-trip probe. The server echoes `text` back to the whole room as
// EchoResult. Exists purely to prove the pipe works end to end.
message Echo {
  string text = 1;
}

// Host-only: start a game in the current room. `game_id` must name a game the
// server has registered. `options` is the proto3-JSON encoding of a
// game-specific start-options message (defined in that game's .proto), the
// same pattern as GameAction.payload. Empty means "use that game's defaults".
message StartGame {
  string game_id = 1;
  string options = 2;
}

// An action within the running game. `payload` is the proto3-JSON encoding of a
// game-specific client message (defined in that game's .proto), never a
// hand-written shape.
message GameAction {
  string game_id = 1;
  string payload = 2;
}

// Host-only, before a game starts: declare the options the host currently has
// selected for its next game (e.g. Imposter's category), so the whole lobby
// can see the choice as it's made. `options` is the proto3-JSON encoding of
// that game's own start-options message, the same shape StartGame.options
// uses. This message is advisory only — the room does not remember or apply
// it; the host must still send the same options on StartGame when they're
// ready to begin.
message SetGameOptions {
  string game_id = 1;
  string options = 2;
}

// ── Server → Client ───────────────────────────────────────────────────────

// Every message the server sends is a ServerMessage with exactly one payload set.
message ServerMessage {
  oneof payload {
    RoomJoined room_joined = 1;
    PlayerJoined player_joined = 2;
    PlayerLeft player_left = 3;
    EchoResult echo_result = 4;
    ErrorInfo error = 5;
    HostChanged host_changed = 6;
    GameStarted game_started = 7;
    GameEvent game_event = 8;
    GameEnded game_ended = 9;
    GameOptionsChanged game_options_changed = 10;
    PlayerPresence player_presence = 11;
  }
}

// Sent only to the player who just joined (via CreateRoom, JoinRoom or
// ResumeRoom): their own identity, the current host, and the full current
// roster.
message RoomJoined {
  string room_code = 1;
  string self_player_id = 2;
  repeated Player players = 3;
  string host_id = 4;

  // The secret that reclaims this seat with ResumeRoom. Only ever sent to the
  // player it belongs to.
  string session_token = 5;

  // True when this answers a ResumeRoom: the same seat, not a new player.
  bool resumed = 6;

  // Set on a resume when this player has a seat in a running game. The client
  // goes straight back to that game instead of the lobby.
  string active_game_id = 7;

  // Every GameEvent payload this player has been sent in the running game, in
  // order, including those missed while disconnected. Replaying them rebuilds
  // the screen, so a game needs no reconnect logic of its own. They travel in
  // this one message rather than as separate frames so that a long replay cannot
  // overflow the connection's small send queue.
  repeated string game_events = 8;

  // Players on the roster whose connection has dropped. See PlayerPresence.
  repeated string offline_player_ids = 9;
}

// Broadcast when a player's connection drops or comes back. They stay on the
// roster while the server holds their seat; PlayerLeft follows if they do not
// return in time.
message PlayerPresence {
  string player_id = 1;
  bool connected = 2;
}

// Broadcast to the players already in a room when someone new joins.
message PlayerJoined {
  Player player = 1;
}

// Broadcast when a player leaves explicitly or their connection is reaped.
message PlayerLeft {
  string player_id = 1;
}

// Broadcast to the whole room in response to an Echo.
message EchoResult {
  string text = 1;
  string from_player_id = 2;
}

// A problem with the client's last message. Not fatal to the connection.
message ErrorInfo {
  // Stable, machine-readable: "room_not_found", "not_in_room", "bad_message",
  // "session_expired", "session_replaced" (another tab or device reclaimed
  // this seat, so this connection no longer speaks for it), or "kicked" (the
  // host removed this player from the room; the client should leave it).
  string code = 1;
  // Human-readable detail for logs and debugging. Not localized.
  string message = 2;
}

// Broadcast when the room's host changes — the previous host left, so the
// longest-present remaining player takes over.
message HostChanged {
  string host_id = 1;
}

// Broadcast when a game begins. Game-specific setup then arrives as GameEvents.
message GameStarted {
  string game_id = 1;
}

// A message from the running game. May be broadcast or targeted at one player
// (the server decides who receives it). `payload` is the proto3-JSON encoding
// of a game-specific server message defined in that game's .proto.
message GameEvent {
  string game_id = 1;
  string payload = 2;
}

// Broadcast when a game stops, whether it finished or was aborted.
message GameEnded {
  string game_id = 1;
  // Stable, machine-readable, e.g. "finished", "player_left", "host_ended".
  // A game may define its own reasons too (Imposter sends "imposter_left"),
  // so clients must treat an unrecognized reason as a plain "game over".
  string reason = 2;
}

// Broadcast to the whole room whenever the host's SetGameOptions is accepted,
// so every client — not just the host's — can render the pending choice
// (e.g. "Category: Food") while still in the lobby.
message GameOptionsChanged {
  string game_id = 1;
  string options = 2;
}
