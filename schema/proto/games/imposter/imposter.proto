syntax = "proto3";

package imposter.v1;

option go_package = "github.com/mintthiha/party-games/server/internal/games/imposter/pb;pb";

// Wire messages for the Imposter game. Carried inside the core protocol's
// GameEvent / GameAction envelopes as proto3 JSON.
//
// Ruleset (v1): exactly one imposter, who gets no word. One clue word per
// player per pass, in a server-set order, for StartOptions.clue_passes passes
// of the table — the same players in the same order, each speaking again after
// hearing everyone else, which is where an imposter who survived the first
// pass usually comes undone. Everyone then votes; a tie means no one is
// removed and the imposter escapes. If the vote catches the imposter, they get
// one blind guess at the secret word to steal the win before the round's
// Outcome is revealed.
//
// A game is a *match* of StartOptions.rounds rounds. Points carry across
// rounds and the match has a winner: a caught imposter scores +1 for every
// crew member still in the round, an escaped imposter +2 for themselves, and a
// caught imposter whose steal guess lands +3 instead. Running totals ride
// along on every Outcome.
//
// A finished round stays on everyone's screen until a player sends PlayAgain.
// That starts the next round — fresh word, fresh imposter, reshuffled
// turn order, same scores — unless it was the last one, in which case
// the match ends with GameEnded "finished".
//
// A player leaving mid-round does not end it. They drop out of the turn order
// and the candidate list, and the phase they were holding up advances without
// them; their clue stays in the recap, so clients must tolerate a clue or a
// vote tally naming an id no longer in the roster. A departure during the
// vote always reopens the ballot (a fresh VotePhase, same clues, with the
// leaver dropped from candidate_ids, plus a VoteProgress for the count),
// since a client builds its ballot from the VotePhase it was handed. Votes
// cast for the departing player are void; the rest stand.
//
// The round is abandoned, with GameEnded, only if the imposter is the one
// who left (reason "imposter_left") or too few players remain (reason
// "player_left").
//
// Every word carries two separate pieces of text: its category (e.g.
// "Animals") and a hint (e.g. "Hops and carries young in a pouch" for
// Kangaroo). The category is public — crew and imposter both see it, since
// it's not enough on its own to guess the word. The host may additionally
// turn on hints for the imposter (StartOptions.hints_enabled): the imposter
// still gets no word, but does get the hint, the same mercy a harder or
// easier room might want to tune.

// Sent as StartGame.options (proto3-JSON) when the host starts an Imposter
// round. Omitted or all-default fields mean "use the defaults".
message StartOptions {
  // When true, the imposter's RoleAssignment includes the category (never
  // the word) so they have something to go on while bluffing.
  bool hints_enabled = 1;

  // How many times the table goes around giving clues before the vote. 0 (the
  // default) means 2; anything above 3 is clamped to 3. One pass is the quick
  // version — it was the only version before this field existed.
  int32 clue_passes = 4;

  // How many rounds the match runs for. 0 (the default) means 3; anything
  // above 10 is clamped to 10, so a client cannot ask for a thousand-round
  // match. Scores carry across every round of a match.
  int32 rounds = 3;

  // How long each player gets to give one clue, in seconds. 0 (the default)
  // means no clock at all, which is how the game worked before this field
  // existed; anything above 120 is clamped to 120.
  //
  // Note this field reads its zero differently from rounds and clue_passes
  // above: there, 0 means "use the server's default", because every match has
  // some number of rounds. Here there is a real "off", and off is the default.
  int32 clue_seconds = 5;

  // Restricts the secret word to one category: "places", "food", "animals",
  // "objects", "activities", "jobs", or "weather". Empty (the default) draws
  // from every category. An unrecognized key is treated the same as empty
  // rather than rejected, so an older client's category choice degrades to
  // "any" instead of failing the round.
  string category = 2;
}

// ── Server → Client ───────────────────────────────────────────────────────

message ImposterServerMessage {
  oneof body {
    RoleAssignment role_assignment = 1;
    RevealProgress reveal_progress = 2;
    ClueTurn clue_turn = 3;
    VotePhase vote_phase = 4;
    VoteProgress vote_progress = 5;
    VoteTally vote_tally = 6;
    Outcome outcome = 7;
    StealPrompt steal_prompt = 8;
  }
}

// Sent privately to each player at the start of a round. For the imposter,
// `word` is always empty. `category` is always set for everyone — it's
// public knowledge, not a hint. `hint` is set only for the imposter, and only
// when the host turned hints on for this round (StartOptions.hints_enabled);
// it's a stronger clue than the category, but still never the word itself.
message RoleAssignment {
  bool is_imposter = 1;
  string word = 2;
  string category = 3;
  string hint = 4;

  // Where this round sits in the match: round 1-based, total_rounds the match
  // length. A second RoleAssignment arriving is how a client learns the next
  // round has begun, so it clears whatever the last round left on screen.
  int32 round = 5;
  int32 total_rounds = 6;
}

// One player's standing in the match. score is their running total after the
// round the message belongs to; delta is what that round alone earned them,
// which is 0 for everyone who scored nothing.
message ScoreEntry {
  string player_id = 1;
  int32 score = 2;
  int32 delta = 3;
}

// Broadcast as players confirm they have seen their role, so every client can
// show "3 / 5 ready".
message RevealProgress {
  repeated string ready_player_ids = 1;
  int32 total = 2;
}

// One player's clue, in the order it was given.
message ClueEntry {
  string player_id = 1;
  string text = 2;
}

// Broadcast whenever the clue phase advances: at its start, and again after
// each clue. `player_id` is whose turn it is now.
//
// turn_index and total describe the position within the current pass of the
// table, not the whole clue phase: on a two-pass round they both restart when
// the second pass begins, and clue_pass says which pass that is. clues_so_far
// keeps growing across passes, so the second pass is given with the first
// pass's clues still on screen — which is the point of having one.
message ClueTurn {
  string player_id = 1;
  int32 turn_index = 2; // 0-based, within this pass
  int32 total = 3;      // clues expected in this pass: one per player still in the round
  repeated ClueEntry clues_so_far = 4;
  int32 clue_pass = 5;        // 1-based
  int32 total_clue_passes = 6;

  // How many seconds this turn has, or 0 for an untimed round. The clock that
  // decides is the server's: when it runs out, the server records the turn as
  // missed and moves on by itself. A client counting down from this number is
  // showing the player what is about to happen, not causing it, so a phone
  // that sleeps or drifts loses nothing but the display.
  //
  // (VotePhase.vote_seconds is the older, weaker pattern: that countdown runs
  // only on the client, which auto-submits when it ends.)
  int32 clue_seconds = 7;
}

// Broadcast once, when every player has given a clue and voting opens.
message VotePhase {
  repeated ClueEntry clues = 1;      // the full recap, in turn order
  repeated string candidate_ids = 2; // who can be voted for, in turn order
  // How long the room has to vote. The deadline is the server's: when it
  // expires, every player who has not voted is recorded as abstaining and the
  // round resolves. A client counts down from this number to show the player
  // what is coming, and submits nothing of its own when it reaches zero.
  int32 vote_seconds = 3;
}

// Broadcast as votes come in, so clients can show "2 / 5 voted".
message VoteProgress {
  repeated string voted_player_ids = 1;
  int32 total = 2;
}

message VoteCount {
  string player_id = 1;
  int32 votes = 2;
}

// Broadcast once everyone has voted.
message VoteTally {
  repeated VoteCount counts = 1;
  // Empty if the top vote count was tied — nobody is removed in that case.
  string voted_out_id = 2;
  int32 abstain_count = 3;
}

// Broadcast once, instead of Outcome, when the vote catches the imposter.
// Everyone waits while the imposter gets one blind guess at the word.
message StealPrompt {
  string imposter_id = 1;

  // How long the imposter has to guess, on the same terms as
  // VotePhase.vote_seconds: the server ends it, and an unmade guess counts as
  // a wrong one.
  int32 steal_seconds = 2;
}

// Sent privately to each player once the round is fully decided — right after
// VoteTally if the imposter wasn't caught, or after their steal guess if they
// were. word/category/hint are localized per recipient, which is why this
// isn't a broadcast.
message Outcome {
  string imposter_id = 1;
  string word = 2;
  string category = 3;
  bool crew_won = 4;
  string voted_out_id = 5; // empty if the vote was tied

  // Set only when the imposter was caught and got a steal guess.
  bool steal_attempted = 6;
  string steal_guess = 7;
  bool steal_correct = 8;

  // The hint the imposter was given, if the round had hints on
  // (StartOptions.hints_enabled). Empty on a hints-off round — not something
  // to render as a blank line.
  string hint = 9;

  // ── Match, not round ──
  // Where this round sat in the match, and the scores it leaves behind.
  int32 round = 10; // 1-based
  int32 total_rounds = 11;

  // Every player the match started with, highest score first, ties broken by
  // the original join order. Players who left mid-match stay listed with the
  // score they had: their points were really earned, and dropping them would
  // silently rewrite the table.
  repeated ScoreEntry scores = 12;

  // True when no further round follows, either because this was the last one
  // or because too few players remain to play another. PlayAgain then ends the
  // match instead of starting a round.
  bool match_over = 13;

  // The winner (or winners, on a tie), set only when match_over is true.
  // Limited to players still in the room — someone who left does not win a
  // match they are not in — so it can be empty even when scores are not.
  repeated string winner_ids = 14;
}

// ── Client → Server ───────────────────────────────────────────────────────

message ImposterClientMessage {
  oneof body {
    MarkReady mark_ready = 1;
    SubmitClue submit_clue = 2;
    CastVote cast_vote = 3;
    GuessWord guess_word = 4;
    PlayAgain play_again = 5;
  }
}

// "I have seen my role." When everyone has sent this, the round advances.
message MarkReady {}

// One player's clue. Only accepted from whoever's turn it currently is.
message SubmitClue {
  string text = 1;
}

// One player's vote. Accepted (and replaceable) from anyone until everyone
// has voted. abstain and a non-empty suspect_id are mutually exclusive; if
// abstain is set, suspect_id is ignored.
message CastVote {
  string suspect_id = 1;
  bool abstain = 2;
}

// The caught imposter's one blind guess at the secret word. Only accepted
// from the imposter, and only while the steal phase is open.
message GuessWord {
  string text = 1;
}

// "On to the next round." Only accepted once the current round has reached its
// Outcome. Starts the next round of the match, or — on the last round, or when
// too few players remain for another — ends the match with GameEnded.
message PlayAgain {}
